<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ОФИС ЛОТО</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #121212;
      --panel: #1b1b1b;
      --cell: #242424;
      --cell-border: #333333;
      --cream: #e9c96b;
      --cream-dark: #c6a84e;
      --text: #f4f1e8;
      --muted: #999999;
      --green: #7fc47f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 28px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--cream);
      margin-bottom: 7px;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .game-title {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 12px;
      padding: 13px 15px;
      background: var(--panel);
      border: 1px solid #292929;
      border-radius: 14px;
    }

    .info-label {
      color: var(--muted);
      font-size: 13px;
    }

    .counter {
      font-size: 18px;
      font-weight: 800;
      color: var(--cream);
    }

    .card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      width: 100%;
    }

    .cell {
      position: relative;
      min-height: 108px;
      padding: 10px 7px;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background: var(--cell);
      border: 1px solid var(--cell-border);
      border-radius: 13px;

      color: var(--text);
      font-size: 13px;
      line-height: 1.15;
      font-weight: 650;

      cursor: pointer;
      user-select: none;

      transition:
        transform 0.12s ease,
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .cell:active {
      transform: scale(0.96);
    }

    .cell.selected {
      background: var(--cream);
      border-color: var(--cream);
      color: #171717;
    }

    .check {
      position: absolute;
      top: 6px;
      right: 8px;

      width: 22px;
      height: 22px;

      display: none;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #171717;
      color: var(--cream);

      font-size: 14px;
      font-weight: 900;
    }

    .cell.selected .check {
      display: flex;
    }

    .button {
      width: 100%;
      margin-top: 16px;
      padding: 17px 15px;

      border: 0;
      border-radius: 14px;

      background: var(--cream);
      color: #171717;

      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.8px;

      cursor: pointer;
    }

    .button:active {
      transform: scale(0.98);
    }

    .hint {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;

      background: var(--panel);
      border: 1px solid #333333;

      font-size: 14px;
      line-height: 1.4;
    }

    .message.show {
      display: block;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #666;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 380px) {
      .cell {
        min-height: 94px;
        font-size: 12px;
      }

      .logo {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">ОФИС</div>
    <div class="subtitle">Музыкальное лото</div>

    <div class="game-title">🎵 ОФИС ЛОТО</div>
  </div>

  <div class="info">
    <div class="info-label">Отмечено песен</div>
    <div class="counter">
      <span id="selectedCount">0</span> / 9
    </div>
  </div>

  <div class="card" id="card"></div>

  <button class="button" id="checkButton">
    ПРОВЕРИТЬ КАРТОЧКУ
  </button>

  <div class="message" id="message"></div>

  <div class="hint">
    Услышал песню — найди её на карточке и нажми на неё.
  </div>

  <div class="footer">
    ОФИС • ИГРАЕМ ВМЕСТЕ
  </div>

</div>

<script>
  // ==============================
  // TELEGRAM
  // ==============================

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();

    try {
      tg.setHeaderColor("#121212");
      tg.setBackgroundColor("#121212");
    } catch (e) {}
  }


  // ==============================
  // 10 ГОТОВЫХ КАРТОЧЕК
  // ==============================

  const cards = [

    // Карточка 1
    [
      "Dracula",
      "Тело убийца",
      "Malo 2.0",
      "Caliente",
      "67",
      "Экспонат",
      "Лампочки",
      "No batidao",
      "Купер"
    ],

    // Карточка 2
    [
      "Силуэт",
      "Мальборо",
      "One Desire",
      "Тону",
      "Espresso macchiato",
      "Базовый минимум",
      "Nobody",
      "SMS",
      "Знак"
    ],

    // Карточка 3
    [
      "Под Новый год",
      "Dracula",
      "Пузико",
      "За горами за лесами",
      "Just the Way you are",
      "Matadora",
      "O Yeah",
      "Мальборо",
      "Тело убийца"
    ],

    // Карточка 4
    [
      "Хватит, Довольно",
      "67",
      "Rock that body",
      "Тону",
      "Электрощиток",
      "Экспонат",
      "Баобаб",
      "Силуэт",
      "Nobody"
    ],

    // Карточка 5
    [
      "Течет ручей",
      "Caliente",
      "Ты не бойся ночи",
      "One Desire",
      "Мало 2.0",
      "За горами за лесами",
      "SMS",
      "Пузико",
      "Supersonic"
    ],

    // Карточка 6
    [
      "Я тебя могну",
      "No batidao",
      "Лампочки",
      "Matadora",
      "Espresso macchiato",
      "Знак",
      "Под Новый год",
      "Купер",
      "Хватит, Довольно"
    ],

    // Карточка 7
    [
      "Nobody",
      "Баобаб",
      "Dracula",
      "Электрощиток",
      "Just the Way you are",
      "67",
      "Rock that body",
      "Malo 2.0",
      "Тону"
    ],

    // Карточка 8
    [
      "Базовый минимум",
      "Supersonic",
      "Мальборо",
      "Течет ручей",
      "O Yeah",
      "Тело убийца",
      "За горами за лесами",
      "One Desire",
      "Caliente"
    ],

    // Карточка 9
    [
      "Силуэт",
      "Я тебя могну",
      "Пузико",
      "SMS",
      "Экспонат",
      "Ты не бойся ночи",
      "No batidao",
      "Под Новый год",
      "Nobody"
    ],

    // Карточка 10
    [
      "Espresso macchiato",
      "Купер",
      "Лампочки",
      "Мало 2.0",
      "Хватит, Довольно",
      "Знак",
      "Баобаб",
      "Just the Way you are",
      "Электрощиток"
    ]

  ];


  // ==============================
  // ВЫБОР КАРТОЧКИ
  // ==============================

  const CARD_KEY = "office_loto_card";
  const SELECTED_KEY = "office_loto_selected";

  let cardIndex = localStorage.getItem(CARD_KEY);

  if (cardIndex === null) {

    cardIndex = Math.floor(Math.random() * cards.length);

    localStorage.setItem(CARD_KEY, cardIndex);

  } else {

    cardIndex = Number(cardIndex);

  }

  const currentCard = cards[cardIndex];


  // ==============================
  // СОХРАНЕНИЕ ОТМЕЧЕННЫХ ПЕСЕН
  // ==============================

  let selected = [];

  try {

    const saved = JSON.parse(
      localStorage.getItem(SELECTED_KEY) || "[]"
    );

    if (Array.isArray(saved)) {
      selected = saved;
    }

  } catch (e) {
    selected = [];
  }


  // ==============================
  // СОЗДАНИЕ КАРТОЧКИ
  // ==============================

  const cardElement = document.getElementById("card");
  const selectedCount = document.getElementById("selectedCount");
  const message = document.getElementById("message");


  function renderCard() {

    cardElement.innerHTML = "";

    currentCard.forEach((song, index) => {

      const cell = document.createElement("div");

      cell.className = "cell";

      if (selected.includes(index)) {
        cell.classList.add("selected");
      }

      cell.innerHTML = `
        <span>${song}</span>
        <div class="check">✓</div>
      `;

      cell.addEventListener("click", () => {

        if (selected.includes(index)) {

          selected = selected.filter(
            item => item !== index
          );

        } else {

          selected.push(index);

        }

        localStorage.setItem(
          SELECTED_KEY,
          JSON.stringify(selected)
        );

        renderCard();

      });

      cardElement.appendChild(cell);

    });

    selectedCount.textContent = selected.length;

  }


  renderCard();


  // ==============================
  // ПРОВЕРКА
  // ==============================

  document
    .getElementById("checkButton")
    .addEventListener("click", () => {

      message.classList.add("show");

      if (selected.length === 9) {

        message.innerHTML =
          "🎉 <strong>Все 9 песен отмечены!</strong><br><br>" +
          "Если это произошло первым — сообщи ведущему.";

      } else if (selected.length === 0) {

        message.innerHTML =
          "Пока не отмечена ни одна песня.";

      } else {

        message.innerHTML =
          "Отмечено <strong>" +
          selected.length +
          " из 9</strong> песен.<br><br>" +
          "Продолжай слушать! 🎵";

      }

    });

</script>

</body>
</html>
